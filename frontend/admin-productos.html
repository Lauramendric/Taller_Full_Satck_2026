<!DOCTYPE html> 
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Tienda Online" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración Productos</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"> 
</head>

<body>

   <!-- BARRA DE NAVEGACIÓN -->
    
    <nav class="navbar navbar-dark">
        <div class="container">
         <a class="navbar-brand" href="index.html">Tecnohogar</a>
          <div>
            <a href="index.html" class="text-white me-3">Inicio</a>
            <a href="productos.html" class="text-white me-3">Productos</a>
            <a href="ayuda.html" class="text-white me-3">Ayuda</a>
            <a href="contacto.html" class="text-white me-3">Contacto</a>
            <a href="login.html" class="text-white me-3">Login</a>
            <button id="btnCerrarSesion" class="btn btn-light btn-sm">
                 Cerrar sesión
            </button>
          </div>
        </div>
    </nav>

  <!-- TÍTULO -->
    <section class="text-center py-4 bg-secondary text-white">
        <div class="container">
            <h1 class="fw-bold">Administración de productos</h1>
            <p class="lead">Registra, edita y elimina productos de ejemplo para la tienda online.</p>
        </div>
    </section>
  <!-- FORMULARIO -->
    <section class="container my-4">
        <div class="card p-4">
            <h4 class="text-center mb-3">Formulario de producto</h4>
            <form id="formProducto">

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Nombre</label>
                        <input type="text" id="nombre" class="form-control" placeholder="Ejemplo: Mouse inalámbrico" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Categoría</label>
                        <input type="text" id="categoria" class="form-control" placeholder="Ejemplo: Accesorios">
                    </div>
                </div>

                   <div class="mb-3">
                    <label class="form-label">Descripción</label>
                    <textarea id="descripcion" class="form-control" rows="3" placeholder="Describe brevemente el producto"></textarea>
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Precio</label>
                        <input type="number" id="precio" class="form-control" placeholder="Ejemplo: 45000" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Stock</label>
                        <input type="number" id="stock" class="form-control" placeholder="Ejemplo: 20">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Imagen</label>
                        <input type="text" id="imagen" class="form-control" placeholder="Ejemplo: img/producto.jpg">
                    </div>
                </div>

                <div class="text-center">
                    <button type="submit" class="btn btn-primary">Guardar producto</button>
                </div>

            </form>
        </div>
    </section>

     <!-- TABLA DE PRODUCTOS -->
    <section class="container my-4">
        <h4 class="text-center mb-3">Listado de productos</h4>
        <div class="table-responsive">
            <table class="table table-bordered table-striped text-center">
                <thead class="table-dark">
                    <tr>
                        <th>Nombre</th>
                        <th>Descripción</th>
                        <th>Precio</th>
                        <th>Categoría</th>
                        <th>Stock</th>
                        <th>Imagen</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaProductos">
                    <!-- Los productos se cargan aquí desde productos.js -->
                </tbody>
            </table>
        </div>
    </section>

    <!-- PIE DE PÁGINA -->
    <footer class="pie">
        Tecnohogar ¡Lo que necesitas para tu hogar!
    </footer>


    <script src="js/auth.js"></script>
    <script src="js/productos.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
