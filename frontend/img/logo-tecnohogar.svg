<svg width="160" height="160" viewBox="0 0 160 160" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Ícono Tecnohogar</title>
  <desc>Casa con señal wifi en verde</desc>

  <!-- Casa -->
  <g transform="translate(80, 95)">
    <!-- Techo -->
    <polygon points="0,-65 65,0 -65,0" fill="#2d6a2d"/>
    <!-- Chimenea -->
    <rect x="22" y="-65" width="13" height="24" rx="2" fill="#1a4a1a"/>
    <!-- Cuerpo -->
    <rect x="-50" y="0" width="100" height="62" rx="3" fill="#3a8a3a"/>
    <!-- Puerta -->
    <rect x="-14" y="27" width="28" height="35" rx="3" fill="#1a4a1a"/>
    <!-- Ventana izquierda -->
    <rect x="-42" y="8" width="22" height="20" rx="2" fill="#e8f5e8"/>
    <line x1="-31" y1="8" x2="-31" y2="28" stroke="#3a8a3a" stroke-width="1.5"/>
    <line x1="-42" y1="18" x2="-20" y2="18" stroke="#3a8a3a" stroke-width="1.5"/>
    <!-- Ventana derecha -->
    <rect x="20" y="8" width="22" height="20" rx="2" fill="#e8f5e8"/>
    <path d="M25,22 Q31,15 37,22" stroke="#2d6a2d" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M22,18 Q31,9 40,18" stroke="#2d6a2d" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <circle cx="31" cy="24" r="2" fill="#2d6a2d"/>
  </g>

  <!-- Señal wifi grande sobre el techo -->
  <g transform="translate(80, 28)">
    <path d="M-22,14 Q0,-8 22,14" stroke="#4a9a4a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M-13,6 Q0,-3 13,6" stroke="#2d6a2d" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="0" cy="9" r="3.5" fill="#2d6a2d"/>
  </g>

</svg>
